<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="bgOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="bgRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="640" height="2" fill="rgba(0,0,0,0.1)"/>
    </pattern>
  </defs>

  <!-- 3 Split Vertical Panels -->
  <rect x="0" y="0" width="214" height="360" fill="url(#bgYellow)"/>
  <rect x="214" y="0" width="212" height="360" fill="url(#bgOrange)"/>
  <rect x="426" y="0" width="214" height="360" fill="url(#bgRed)"/>

  <!-- Panel Dividers -->
  <rect x="212" y="0" width="3" height="360" fill="#7c2d12" opacity="0.35"/>
  <rect x="424" y="0" width="3" height="360" fill="#7f1d1d" opacity="0.4"/>

  <!-- Left Panel Sketchy Wireframe: Park Swings + Brawler -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.55" stroke-linecap="round" stroke-linejoin="round">
    <!-- Swing set wireframe -->
    <path d="M18 335 L58 212 L195 212 L208 335"/>
    <path d="M100 212 L94 275 M138 212 L144 275"/>
    <rect x="88" y="275" width="62" height="7"/>
    <!-- Muscular Brawler Hero -->
    <circle cx="96" cy="242" r="18"/>
    <path d="M80 232 Q96 218 114 232"/>
    <path d="M84 242 L92 242 M100 242 L108 242"/>
    <path d="M88 250 Q96 256 104 250"/>
    <path d="M68 264 L124 264 L132 308 L60 308 Z"/>
    <path d="M44 264 L68 268 L56 292"/>
    <path d="M124 268 L148 264 L136 292"/>
    <path d="M68 308 L62 346 M124 308 L130 346"/>
  </g>
  <g font-family="Impact, 'Chakra Petch', sans-serif" font-weight="900" text-anchor="middle" fill="#ffffff" stroke="#713f12" stroke-width="2">
    <text x="107" y="102" font-size="27" letter-spacing="2">PUT</text>
    <text x="107" y="132" font-size="27" letter-spacing="2">THE</text>
    <text x="107" y="162" font-size="27" letter-spacing="2">HURT</text>
    <text x="107" y="192" font-size="27" letter-spacing="2">ON HIM!</text>
  </g>

  <!-- Center Panel Sketchy Wireframe: Cratered Moon & Stars -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.65">
    <circle cx="320" cy="136" r="62"/>
    <circle cx="294" cy="116" r="13"/>
    <circle cx="346" cy="132" r="17"/>
    <circle cx="312" cy="164" r="10"/>
    <circle cx="342" cy="172" r="6"/>
    <circle cx="288" cy="148" r="5"/>
    <rect x="234" y="92" width="4" height="4" fill="#ffffff"/>
    <rect x="394" y="98" width="4" height="4" fill="#ffffff"/>
    <rect x="248" y="182" width="4" height="4" fill="#ffffff"/>
    <rect x="386" y="188" width="4" height="4" fill="#ffffff"/>
  </g>
  <g font-family="Impact, 'Chakra Petch', sans-serif" font-weight="900" text-anchor="middle" fill="#ffffff" stroke="#7c2d12" stroke-width="2">
    <text x="320" y="240" font-size="26" letter-spacing="1.5">ESCAPE</text>
    <text x="320" y="272" font-size="26" letter-spacing="1.5">FROM</text>
    <text x="320" y="304" font-size="26" letter-spacing="1.5">THE MOON</text>
  </g>

  <!-- Right Panel Sketchy Wireframe: 3D Destroyer of Worlds Arcade Cabinet -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.6" stroke-linejoin="round">
    <polygon points="468,186 566,174 592,202 586,342 466,342 458,216"/>
    <line x1="566" y1="174" x2="562" y2="342"/>
    <!-- Marquee -->
    <polygon points="468,192 562,182 562,204 468,212"/>
    <!-- CRT Screen with Scowl -->
    <rect x="478" y="220" width="72" height="52" rx="3"/>
    <path d="M488 236 L504 242 M540 236 L524 242"/>
    <path d="M488 258 L498 252 L508 260 L518 252 L528 260 L540 254"/>
    <!-- Control Deck & Coin Door -->
    <polygon points="464,278 562,278 574,294 456,294"/>
    <rect x="484" y="302" width="56" height="34"/>
  </g>
  <g font-family="Impact, 'Chakra Petch', sans-serif" font-weight="900" text-anchor="middle" fill="#ffffff" stroke="#450a0a" stroke-width="2">
    <text x="533" y="96" font-size="25" letter-spacing="1.5">DESTROY</text>
    <text x="533" y="126" font-size="25" letter-spacing="1.5">THE</text>
    <text x="533" y="156" font-size="23" letter-spacing="1">DESTROYER!</text>
  </g>

  <!-- Top Select Game Banner -->
  <rect x="172" y="12" width="296" height="42" rx="6" fill="#ffffff" stroke="#090d16" stroke-width="4"/>
  <rect x="176" y="16" width="288" height="34" rx="4" fill="#dc2626"/>
  <text x="320" y="42" font-family="Impact, 'Chakra Petch', sans-serif" font-weight="900" font-size="26" text-anchor="middle" fill="#ffffff" letter-spacing="3">SELECT GAME</text>

  <!-- 3-IN-1 Corner Tag -->
  <rect x="14" y="14" width="78" height="24" rx="4" fill="#090d16" stroke="#ffffff" stroke-width="2"/>
  <text x="53" y="30" font-family="monospace" font-weight="900" font-size="11" text-anchor="middle" fill="#facc15">3-IN-1</text>

  <!-- Scanlines -->
  <rect width="640" height="360" fill="url(#scanlines)"/>
</svg>
